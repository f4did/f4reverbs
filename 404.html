<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0a">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="f4-icon.svg" type="image/svg+xml">
  <title>404 — F4 REVERBS</title>
  <style>
    :root { color-scheme: dark; --acid:#d8ff3e; --ink:#080b0a; --line:#26302c; --muted:#8b9791; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { display:grid; place-items:center; overflow:hidden; background:var(--ink); color:#f2f7f4; font-family:Arial,Helvetica,sans-serif; }
    body::before { content:""; position:fixed; inset:0; opacity:.34; background-image:linear-gradient(#17201c 1px,transparent 1px),linear-gradient(90deg,#17201c 1px,transparent 1px); background-size:48px 48px; pointer-events:none; }
    main { position:relative; width:min(900px,calc(100% - 36px)); padding:34px 0 42px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .brand { color:var(--acid); font:900 20px/1 'Arial Black',Arial,sans-serif; letter-spacing:-.08em; }
    .brand span { margin-left:12px; color:#f2f7f4; font:800 13px/1 'DM Mono',monospace; letter-spacing:.2em; }
    .code { margin-top:80px; color:var(--acid); font:900 clamp(110px,24vw,240px)/.75 'Arial Black',Arial,sans-serif; letter-spacing:-.1em; }
    .eyebrow { margin:34px 0 12px; color:var(--muted); font:11px 'Courier New',monospace; letter-spacing:.18em; }
    h1 { max-width:720px; margin:0; font:900 clamp(32px,7vw,76px)/.9 'Arial Black',Arial,sans-serif; letter-spacing:-.06em; text-transform:uppercase; }
    h1 em { color:var(--acid); font-style:normal; }
    p { max-width:470px; color:var(--muted); font:14px/1.6 'Courier New',monospace; }
    a { display:inline-flex; margin-top:16px; padding:14px 18px; border:1px solid var(--acid); color:var(--acid); font:700 11px 'Courier New',monospace; letter-spacing:.12em; text-decoration:none; text-transform:uppercase; }
    a:hover { background:var(--acid); color:var(--ink); }
    @media (max-width:520px) { main { width:calc(100% - 24px); padding:22px 0 28px; } .code { margin-top:64px; } h1 { font-size:42px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">F4 <span>REVERBS</span></div>
    <div class="code">404</div>
    <div class="eyebrow">SIGNAL LOST / ROUTE NOT FOUND</div>
    <h1>THIS FREQUENCY <em>DOESN’T EXIST.</em></h1>
    <p>The page fell out of the mix. Return to the studio and keep shaping the signal.</p>
    <a href="./">↩ Back to the studio</a>
  </main>
</body>
</html>
